project:
  name: quantization-performance-benchmark
  version: "1.0"

model:
  served_name: quant-benchmark-model

server:
  host: 127.0.0.1
  port: 8000
  gpu_memory_utilization: 0.90
  max_model_len: 4096
  startup_timeout_seconds: 900
  enforce_eager: false

benchmark:
  input_tokens: 512
  output_tokens: 256
  num_prompts: 100
  warmup_prompts: 10

  concurrency_levels:
    - 1
    - 4
    - 8
    - 16
    - 32

  request_rate: inf

  percentile_metrics:
    - ttft
    - tpot
    - itl
    - e2el

  percentiles:
    - 50
    - 95
    - 99

  seed: 42
  temperature: 0

  # Number of independent benchmark repetitions.
  # 1 is the default full run; increase to 2-3 for statistical confidence.
  repetitions: 1

accuracy:
  enabled: true
  minimum_score: 0.80
  num_prompts: 20
  max_tokens: 128

cost:
  gpu_hourly_usd: 0.35

quantization:
  methods:
    - name: fp16
      model: Qwen/Qwen2.5-3B-Instruct
      quantization: null
      dtype: float16

    - name: int8
      model: Qwen/Qwen2.5-3B-Instruct-GPTQ-Int8
      quantization: gptq
      dtype: float16

    - name: int4
      model: Qwen/Qwen2.5-3B-Instruct-GPTQ-Int4
      quantization: gptq
      dtype: float16

output:
  directory: results
